<main class="pagina-inicio">

  <div class="tarjeta-bienvenida">

    <h1>
      Bienvenido al sistema de reservas médicas
    </h1>

    <h2>
      ¡Hola,
      <span
        class="nombre-usuario"
        [textContent]="nombreUsuario()">
      </span>!
    </h2>

    <p>
      Nos alegra tenerte aquí.
    </p>

    <p>
      En nuestro sistema podrás gestionar tus reservas médicas
      de manera fácil y rápida.
    </p>

    <h3>
      ¿Qué deseas hacer hoy?
    </h3>

    <nav class="acciones" aria-label="Opciones del usuario">

      <a
        [routerLink]="['/reservas', usuarioId]"
        class="boton-accion">
        Crear cita
      </a>

      <a
        [routerLink]="['/mostrar-reservas', usuarioId]"
        class="boton-accion boton-secundario">
        Mis reservas
      </a>

      <a routerLink="/inicio-sesion">Cerrar sesión</a>

    </nav>

  </div>

</main>
