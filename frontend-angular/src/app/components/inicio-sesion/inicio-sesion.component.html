<main class="pagina pagina-ingreso">
  <div class="arte-ingreso arte-medico" aria-hidden="true"><span></span></div>
  <div class="contenido-ingreso">
    @if (aviso()) {
      <p class="mensaje mensaje-exito" role="status">{{ aviso() }}</p>
    }
    @if (error()) {
      <p class="mensaje mensaje-error" role="alert">{{ error() }}</p>
    }
    <app-login-form [titulo]="'Ingreso al sistema'" (loginEnviado)="procesarLogin($event)">
    </app-login-form>
  </div>
</main>
