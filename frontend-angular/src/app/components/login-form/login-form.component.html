<section class="tarjeta tarjeta-formulario tarjeta-acceso" aria-labelledby="titulo-login">
  <h1 id="titulo-login">{{ titulo() }}</h1>

  <form class="formulario" (ngSubmit)="enviarLogin()">
    <div class="campo">
      <label for="login-correo">Correo electrónico</label>
      <input
        type="text"
        id="login-correo"
        [(ngModel)]="correo"
        name="correo"
        autocomplete="username"
        inputmode="email"
      />
    </div>

    <div class="campo">
      <label for="login-contrasena">Contraseña</label>
      <input
        type="password"
        id="login-contrasena"
        [(ngModel)]="contrasena"
        name="contrasena"
        autocomplete="current-password"
      />
    </div>

    <button type="submit">Ingresar</button>
  </form>
</section>
