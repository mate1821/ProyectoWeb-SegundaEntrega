<main class="pagina pagina-formulario pagina-reserva">
  <header class="encabezado">
    @if (reservaEditando(); as reserva) {
      <h1>Editar reserva #{{ reserva.idReserva }}</h1>
    } @else {
      <h1>Nueva reserva</h1>
    }
  </header>

  @if (reservaEditando() && error()) {
    <p class="mensaje mensaje-error" role="alert">{{ error() }}</p>
  }

  <app-reserva-form
    [especialidades]="especialidades()"
    [medicos]="medicos()"
    [servicios]="servicios()"
    [reservaEditando]="reservaEditando()"
    [preseleccion]="preseleccion()"
    [horasDisponibles]="horasDisponibles()"
    (especialidadCambiada)="cargarMedicos($event)"
    (diaCambiado)="cargarHoras($event)"
    (reservaGuardada)="guardarReserva($event)"
  >
  </app-reserva-form>
</main>
